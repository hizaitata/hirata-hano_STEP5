<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Sample</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <button id="background-color">背景色を変更</button>
    <form text="text" id="text-form">
        <input type="text" id="text-input" placeholder="テキストを入力してください">
        <button type="button" id="display">表示</button>
        <button type="submit" id="add-button">追加</button>
    </form>
    <h3>表示エリア</h3>
    <div id="display-area"></div>

    <h3>現在の行数: <span id="line-count">0</span></h3>
    <div id="submit-area"></div>
    <table id="text-table">
        <thead>
            <tr>
                <th>内容</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script src="./style.js" defer></script>
</body>
</html>
